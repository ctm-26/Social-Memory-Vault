name: tests

on:
  pull_request:
  push:
    branches:
      - claude/graph-vector-memory-LBqAX

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run complete test suite
        run: python -m pytest

      - name: Build distribution artifacts
        run: python -m build

      - name: Verify schema loading from the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python - <<'PY'
          from social_memory_vault import load_signal_schema

          schema = load_signal_schema()
          assert schema["title"] == "Signal Kernel Contract v0.1"
          print("installed-package schema resource verified")
          PY
